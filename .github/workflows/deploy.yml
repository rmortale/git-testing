name: deploy

on:
  workflow_dispatch:
    inputs:
      proddeploy:
        description: "Deploy till production"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  helm-deploy:
    runs-on: ubuntu-latest

    permissions: write-all

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Create kubeconfig file
        run: echo "${{ secrets.KUBE_CONFIG }}" > ${{ github.workspace }}/kubeconfig

      - name: Deploy to Kubernetes using Helm
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          echo ${{ inputs.proddeploy }}
          helm upgrade --install ${{ github.repository }}-devt \
            https://chart.onechart.dev/onechart-0.73.0.tgz \
            --values k8s/helm-values/k3d-devt-values.yaml \
            --namespace default
